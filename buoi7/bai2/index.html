<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 2 - Danh mục sản phẩm</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; background: #f2f5f9; color: #1e293b; font: 16px/1.5 Arial, sans-serif; }
    main { max-width: 1040px; margin: 0 auto; }
    h1 { margin: 0 0 5px; font-size: 1.8rem; }
    .intro { margin: 0 0 22px; color: #64748b; }
    .products { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .product-card { overflow: hidden; border-radius: 14px; background: white; box-shadow: 0 8px 28px #1e293b14; }
    .product-image { display: block; width: 100%; height: 210px; object-fit: cover; background: #eaf0ff; }
    .product-content { padding: 20px; }
    .product-content h2 { margin: 0 0 7px; font-size: 1.2rem; }
    .price { margin: 0 0 8px; color: #1d4ed8; font-size: 1.2rem; font-weight: 700; }
    .stock { display: inline-block; margin: 0 0 12px; padding: 3px 9px; border-radius: 999px; font-size: .88rem; font-weight: 600; }
    .in-stock { background: #dcfce7; color: #166534; }
    .out-stock { background: #fee2e2; color: #991b1b; }
    .description { min-height: 48px; margin: 0 0 14px; color: #475569; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; }
    button { padding: 9px 13px; border: 0; border-radius: 7px; background: #e8eef7; color: #24354d; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover:not(:disabled) { background: #dbe5f3; }
    button.buy { background: #2563eb; color: white; }
    button.buy:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    [v-cloak] { display: none; }
    @media (max-width: 640px) { body { padding: 22px 12px; } .products { grid-template-columns: 1fr; } .product-content { padding: 17px; } }
  </style>
</head>
<body>
  <main id="app" v-cloak>
    <h1>Danh mục sản phẩm</h1>
    <p class="intro">Mỗi thẻ nhận dữ liệu từ component cha và có thể mở mô tả riêng.</p>
    <section class="products" aria-label="Danh sách sản phẩm">
      <the-san-pham
        v-for="sanPham in sanPhamList"
        :key="sanPham.id"
        :ten="sanPham.ten"
        :gia="sanPham.gia"
        :anh="sanPham.anh"
        :mo-ta="sanPham.moTa"
        :so-luong-ton="sanPham.soLuongTon">
      </the-san-pham>
    </section>
  </main>
  <script src="https://unpkg.com/vue@3.5.44/dist/vue.global.prod.js"></script>
  <script src="components/TheSanPham.js"></script>
  <script src="app.js"></script>
</body>
</html>
